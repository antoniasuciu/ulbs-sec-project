input {
  http {
    port => 8080
    codec => "json"
  }
}

filter {
  if [destination][ip] {
    # 1. Imbogatire Shodan InternetDB (gratuit, rapid, fara consum de credite) + suport API Key
    http {
      url => "https://internetdb.shodan.io/%{[destination][ip]}"
      verb => "GET"
      target_body => "[threat][enrich][shodan]"
      target_headers => "[@metadata][shodan_headers]"
      headers => {
        "Accept" => "application/json"
      }
    }

    # 2. Tagare automata daca Shodan detecteaza porturi C2 uzuale sau vulnerabilitati
    if [threat][enrich][shodan][vulns] {
      mutate {
        add_tag => [ "shodan_vuln_detected", "misp_shodan_enriched" ]
      }
    }
  }
}

output {
  opensearch {
    hosts => ["http://opensearch:9200"]
    index => "siem-events-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}
